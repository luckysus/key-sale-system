
server
{
    listen 80;
    server_name buyer.example.com;

    if ($host != buyer.example.com) {
        return 444;
    }

    # 宝塔/ACME 证书验证配置；没有该文件时可删除这一行。
    include /etc/nginx/nginx/well-known/buyer.example.com.conf;

    location / {
        return 301 https://buyer.example.com$request_uri;
    }
}

server
{
    listen 443 ssl http2;
    server_name buyer.example.com;

    ssl_certificate     /etc/nginx/cert/buyer.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/buyer.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;

    # 买家提取域名不提供后台接口。
    location ^~ /api/admin/ {
        return 404;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    # 拦截源码、数据库、密钥、构建配置等敏感路径。
    location ~* ^/(data|backend|deploy|tests|node_modules|__pycache__|frontend/src|\.git)/ {
        return 404;
    }

    location ~* \.(sqlite|db|sql|py|pyw|pem|key|env|bak|log|txt|map|ts|vue|lock|json)$ {
        return 404;
    }

    location = /api/redeem {
        client_max_body_size 2k;
        limit_req zone=redeem_per_ip burst=5 nodelay;

        proxy_pass http://127.0.0.1:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
        proxy_buffering off;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        proxy_pass http://127.0.0.1:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
    }

    access_log /var/log/nginx/buyer.example.com.log;
    error_log  /var/log/nginx/buyer.example.com.error.log;
}
